name: flatpak-extract
base: core26
version: '1.0.0'
summary: S
description: |
  D

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
  arm64:
    build-on: [arm64]
    build-for: [arm64]

parts:

  python-runtime:
    plugin: nil
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal # for the "python3" symlink
      - python3.14-minimal
      - python3.14-venv

  flatpak-extract:
    after: [python-runtime]  
    plugin: dump
    source: ./local
    source-type: local
    organize:
      local/flatpak-extract: flatpak-extract
    stage-packages:
      - ostree

apps:
  flatpak-extract:
    command: flatpak-extract/flatpak-extract.py
    plugs:
      - home
      - removable-media
      
